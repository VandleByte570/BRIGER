[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/tmp/supervisord.pid


[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700


[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface


[supervisorctl]
serverurl=unix:///tmp/supervisor.sock


; =============================================================================
; BRIGER OpenCode API
; =============================================================================

[program:opencode-server]
command=python -m uvicorn opencode_server.main:app --host %(ENV_OPENCODE_SERVER_HOSTNAME)s --port %(ENV_OPENCODE_SERVER_PORT)s
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/app/logs/opencode-server.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/app/logs/opencode-server-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=WORKSPACE_DIR="%(ENV_WORKSPACE_DIR)s",OPENCODE_CONFIG_DIR="%(ENV_OPENCODE_CONFIG_DIR)s",DATA_DIR="%(ENV_DATA_DIR)s"


; =============================================================================
; Open WebUI
; =============================================================================

[program:openwebui]
command=open-webui serve --host 0.0.0.0 --port %(ENV_PORT)s
directory=/app
autostart=true
autorestart=true
startsecs=10
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/app/logs/openwebui.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/app/logs/openwebui-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=DATA_DIR="%(ENV_DATA_DIR)s",WORKSPACE_DIR="%(ENV_WORKSPACE_DIR)s"


; =============================================================================
; Connector
; =============================================================================

[program:opencode-connector]
command=python3 /app/scripts/opencode_connector.py
directory=/app
autostart=true
autorestart=true
startsecs=3
startretries=5
stdout_logfile=/app/logs/opencode_connector.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/app/logs/opencode_connector-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=DATA_DIR="%(ENV_DATA_DIR)s",OPENCODE_CONFIG_DIR="%(ENV_OPENCODE_CONFIG_DIR)s",OPENCODE_SERVER_HOSTNAME="%(ENV_OPENCODE_SERVER_HOSTNAME)s",OPENCODE_SERVER_PORT="%(ENV_OPENCODE_SERVER_PORT)s"


; =============================================================================
; Process groups
; =============================================================================

[group:briger]
programs=opencode-server,openwebui,opencode-connector
priority=999
