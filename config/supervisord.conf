; =============================================================================
; Supervisord Configuration for Unified AI Suite
; =============================================================================
; Manages three services:
;   1. opencode-server: Python FastAPI server (port 4096)
;   2. openwebui: Open WebUI application server (port 8080/7860)
; =============================================================================

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=5
loglevel=info
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
environment=HOME="/app",USER="appuser"

; =============================================================================
; OpenCode Headless Server (Python FastAPI)
; =============================================================================
[program:opencode-server]
command=python3 -m uvicorn opencode_server.main:app --host %(ENV_OPENCODE_SERVER_HOSTNAME)s --port %(ENV_OPENCODE_SERVER_PORT)s --workers 1
directory=/app
user=appuser
autostart=true
autorestart=true
startsecs=3
startretries=10
stopwaitsecs=30
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/opencode-stdout.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/opencode-stderr.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
environment=OPENCODE_CONFIG_DIR="%(ENV_OPENCODE_CONFIG_DIR)s",OPENCODE_SERVER_PASSWORD="%(ENV_OPENCODE_SERVER_PASSWORD)s",OPENCODE_SERVER_USERNAME="%(ENV_OPENCODE_SERVER_USERNAME)s",HOME="/app",LOG_LEVEL="%(ENV_LOG_LEVEL)s",WORKSPACE_DIR="/app/workspace",PYTHONPATH="/usr/local/lib/python3.11/site-packages:/app/opencode_server"

; =============================================================================
; Open WebUI Application Server
; =============================================================================
[program:openwebui]
command=open-webui serve
directory=/app
user=appuser
autostart=true
autorestart=true
startsecs=10
startretries=10
stopwaitsecs=60
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/openwebui-stdout.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/openwebui-stderr.log
stderr_logfile_maxbytes=100MB
stderr_logfile_backups=5
environment=PORT="%(ENV_PORT)s",HOST="%(ENV_HOST)s",DATA_DIR="%(ENV_DATA_DIR)s",WEBUI_SECRET_KEY="%(ENV_WEBUI_SECRET_KEY)s",WEBUI_AUTH="%(ENV_WEBUI_AUTH)s",ENABLE_SIGNUP="%(ENV_ENABLE_SIGNUP)s",WEBUI_NAME="%(ENV_WEBUI_NAME)s",OPENAI_API_BASE_URL="%(ENV_OPENAI_API_BASE_URL)s",OPENAI_API_KEY="%(ENV_OPENAI_API_KEY)s",OLLAMA_BASE_URL="%(ENV_OLLAMA_BASE_URL)s",ANTHROPIC_API_KEY="%(ENV_ANTHROPIC_API_KEY)s",GOOGLE_API_KEY="%(ENV_GOOGLE_API_KEY)s",DATABASE_URL="%(ENV_DATABASE_URL)s",ENV="%(ENV_ENV)s",DOCKER="%(ENV_DOCKER)s",SCARF_NO_ANALYTICS="%(ENV_SCARF_NO_ANALYTICS)s",DO_NOT_TRACK="%(ENV_DO_NOT_TRACK)s",ANONYMIZED_TELEMETRY="%(ENV_ANONYMIZED_TELEMETRY)s",RAG_EMBEDDING_MODEL="%(ENV_RAG_EMBEDDING_MODEL)s",DEVICE_TYPE="%(ENV_DEVICE_TYPE)s",GLOBAL_LOG_LEVEL="%(ENV_GLOBAL_LOG_LEVEL)s",LOG_LEVEL="%(ENV_LOG_LEVEL)s",HOME="/app"

; =============================================================================
; Event Listener: Restart on fatal errors
; =============================================================================
[eventlistener:processes]
command=bash -c 'printf "READY\n"; while read line; do echo "$line" | grep -q "PROCESS_STATE_FATAL" && supervisorctl restart all; done'
events=PROCESS_STATE_FATAL
buffer_size=50
