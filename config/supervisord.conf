; =============================================================================
; BRIGER - Supervisor Configuration
; =============================================================================

[supervisord]
nodaemon=true
user=root

logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=5

loglevel=info
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

environment=HOME="/app",USER="appuser"


; =============================================================================
; OpenCode FastAPI Server
; =============================================================================

[program:opencode-server]

command=python3 -m uvicorn opencode_server.main:app --host 0.0.0.0 --port %(ENV_OPENCODE_SERVER_PORT)s --workers 1

directory=/app
user=appuser

autostart=true
autorestart=true

startsecs=3
startretries=10

stopwaitsecs=30
stopsignal=TERM

stopasgroup=true
killasgroup=true

stdout_logfile=/var/log/supervisor/opencode-stdout.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

stderr_logfile=/var/log/supervisor/opencode-stderr.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5

environment=\
HOME="/app",\
USER="appuser",\
PYTHONPATH="/usr/local/lib/python3.11/site-packages:/app",\
WORKSPACE_DIR="/app/workspace",\
OPENCODE_CONFIG_DIR="/app/.opencode",\
OPENCODE_SERVER_HOSTNAME="%(ENV_OPENCODE_SERVER_HOSTNAME)s",\
OPENCODE_SERVER_PORT="%(ENV_OPENCODE_SERVER_PORT)s",\
OPENCODE_SERVER_USERNAME="%(ENV_OPENCODE_SERVER_USERNAME)s",\
OPENCODE_SERVER_PASSWORD="%(ENV_OPENCODE_SERVER_PASSWORD)s",\
LOG_LEVEL="%(ENV_LOG_LEVEL)s"


; =============================================================================
; Open WebUI
; =============================================================================

[program:openwebui]

command=open-webui serve --host 0.0.0.0 --port %(ENV_PORT)s

directory=/app
user=appuser

autostart=true
autorestart=true

startsecs=10
startretries=10

stopwaitsecs=60
stopsignal=TERM

stopasgroup=true
killasgroup=true

stdout_logfile=/var/log/supervisor/openwebui-stdout.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=5

stderr_logfile=/var/log/supervisor/openwebui-stderr.log
stderr_logfile_maxbytes=100MB
stderr_logfile_backups=5

environment=\
HOME="/app",\
USER="appuser",\
HOST="%(ENV_HOST)s",\
PORT="%(ENV_PORT)s",\
DATA_DIR="%(ENV_DATA_DIR)s",\
WEBUI_SECRET_KEY="%(ENV_WEBUI_SECRET_KEY)s",\
WEBUI_AUTH="%(ENV_WEBUI_AUTH)s",\
ENABLE_SIGNUP="%(ENV_ENABLE_SIGNUP)s",\
WEBUI_NAME="%(ENV_WEBUI_NAME)s",\
OPENAI_API_BASE_URL="%(ENV_OPENAI_API_BASE_URL)s",\
OPENAI_API_KEY="%(ENV_OPENAI_API_KEY)s",\
OLLAMA_BASE_URL="%(ENV_OLLAMA_BASE_URL)s",\
ANTHROPIC_API_KEY="%(ENV_ANTHROPIC_API_KEY)s",\
GOOGLE_API_KEY="%(ENV_GOOGLE_API_KEY)s",\
DATABASE_URL="%(ENV_DATABASE_URL)s",\
ENV="%(ENV_ENV)s",\
DOCKER="%(ENV_DOCKER)s",\
SCARF_NO_ANALYTICS="%(ENV_SCARF_NO_ANALYTICS)s",\
DO_NOT_TRACK="%(ENV_DO_NOT_TRACK)s",\
ANONYMIZED_TELEMETRY="%(ENV_ANONYMIZED_TELEMETRY)s",\
RAG_EMBEDDING_MODEL="%(ENV_RAG_EMBEDDING_MODEL)s",\
DEVICE_TYPE="%(ENV_DEVICE_TYPE)s",\
GLOBAL_LOG_LEVEL="%(ENV_GLOBAL_LOG_LEVEL)s",\
LOG_LEVEL="%(ENV_LOG_LEVEL)s"


; =============================================================================
; Restart listener
; =============================================================================

[eventlistener:processes]

command=bash -c 'printf "READY\n"; while read line; do echo "$line" | grep -q "PROCESS_STATE_FATAL" && supervisorctl restart all; done'

events=PROCESS_STATE_FATAL
buffer_size=50
