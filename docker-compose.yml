# =============================================================================
# BRIGER - Docker Compose
# =============================================================================

services:

  briger:
    build:
      context: .
      dockerfile: Dockerfile
      target: final

    image: briger:latest

    container_name: briger

    restart: unless-stopped

    ports:
      # Open WebUI
      - "${PORT:-8080}:${PORT:-8080}"

      # BRIGER OpenCode API
      - "${OPENCODE_SERVER_PORT:-4096}:4096"

    env_file:
      - .env

    environment:

      # -----------------------------------------------------------------------
      # Open WebUI
      # -----------------------------------------------------------------------

      PORT: "${PORT:-8080}"
      HOST: "0.0.0.0"

      DATA_DIR: "/app/data"

      ENV: "prod"

      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY:-}"

      WEBUI_AUTH: "${WEBUI_AUTH:-true}"

      ENABLE_SIGNUP: "${ENABLE_SIGNUP:-true}"

      WEBUI_NAME: "${WEBUI_NAME:-BRIGER}"

      DATABASE_URL: "${DATABASE_URL:-sqlite:////app/data/webui.db}"

      # -----------------------------------------------------------------------
      # Model providers
      # -----------------------------------------------------------------------

      OPENAI_API_BASE_URL: "${OPENAI_API_BASE_URL:-}"

      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"

      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"

      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"

      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-}"

      # -----------------------------------------------------------------------
      # OpenCode
      # -----------------------------------------------------------------------

      OPENCODE_SERVER_HOSTNAME: "0.0.0.0"

      OPENCODE_SERVER_PORT: "4096"

      OPENCODE_SERVER_USERNAME: "${OPENCODE_SERVER_USERNAME:-opencode}"

      OPENCODE_SERVER_PASSWORD: "${OPENCODE_SERVER_PASSWORD:-}"

      OPENCODE_CONFIG_DIR: "/app/.opencode"

      WORKSPACE_DIR: "/app/workspace"

      OPENCODE_TIMEOUT: "${OPENCODE_TIMEOUT:-1800}"

      COMMAND_TIMEOUT: "${COMMAND_TIMEOUT:-300}"

      # -----------------------------------------------------------------------
      # GodMode
      # -----------------------------------------------------------------------

      GODMODE_ENABLED: "${GODMODE_ENABLED:-true}"

      GODMODE_AUTO_CHECKPOINT: "${GODMODE_AUTO_CHECKPOINT:-true}"

      GODMODE_REQUIRE_CONFIRMATION: "${GODMODE_REQUIRE_CONFIRMATION:-true}"

      # -----------------------------------------------------------------------
      # Telemetry
      # -----------------------------------------------------------------------

      SCARF_NO_ANALYTICS: "true"

      DO_NOT_TRACK: "true"

      ANONYMIZED_TELEMETRY: "false"

      # -----------------------------------------------------------------------
      # RAG
      # -----------------------------------------------------------------------

      RAG_EMBEDDING_MODEL: "${RAG_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}"

      RAG_EMBEDDING_ENGINE: "${RAG_EMBEDDING_ENGINE:-}"

      DEVICE_TYPE: "${DEVICE_TYPE:-cpu}"

      ENABLE_RAG_WEB_SEARCH: "${ENABLE_RAG_WEB_SEARCH:-false}"

      RAG_WEB_SEARCH_ENGINE: "${RAG_WEB_SEARCH_ENGINE:-duckduckgo}"

      SEARXNG_QUERY_URL: "${SEARXNG_QUERY_URL:-}"

      # -----------------------------------------------------------------------
      # Logging
      # -----------------------------------------------------------------------

      GLOBAL_LOG_LEVEL: "${GLOBAL_LOG_LEVEL:-INFO}"

      LOG_LEVEL: "${LOG_LEVEL:-INFO}"

    volumes:

      # Persistent Open WebUI database/data
      - openwebui-data:/app/data

      # Coding workspace
      - opencode-workspace:/app/workspace

      # Repository skills
      - ./.opencode/skills:/app/.opencode/skills:ro

      # Open WebUI integrations
      - ./open_webui/functions:/app/open_webui/functions:ro
      - ./open_webui/tools:/app/open_webui/tools:ro

      # Logs
      - suite-logs:/app/logs

      # Host timezone
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

    deploy:

      resources:

        limits:
          cpus: "4.0"
          memory: 8G

        reservations:
          cpus: "1.0"
          memory: 2G

    healthcheck:

      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:$${PORT:-8080}/health >/dev/null || exit 1"
        ]

      interval: 30s

      timeout: 10s

      retries: 5

      start_period: 90s

    networks:
      - briger-network


# =============================================================================
# Volumes
# =============================================================================

volumes:

  openwebui-data:
    driver: local

  opencode-workspace:
    driver: local

  suite-logs:
    driver: local


# =============================================================================
# Network
# =============================================================================

networks:

  briger-network:
    driver: bridge
